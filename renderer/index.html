<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; media-src file: blob:; style-src 'self'; script-src 'self'">
  <title>Lumina Player</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <main id="stage">
      <video id="video" preload="metadata"></video>
      <div id="empty">
        <p class="big">Glisse une vidéo ici</p>
        <p>ou <button id="emptyOpen" class="link">choisis un fichier</button></p>
      </div>
      <div id="toast" role="status"></div>
      <div id="bar">
        <input id="seek" type="range" min="0" max="1000" value="0" aria-label="Position">
        <div class="row">
          <button id="prev" title="Précédent (P)">⏮</button>
          <button id="play" title="Lecture / pause (Espace)">▶</button>
          <button id="next" title="Suivant (N)">⏭</button>
          <span id="time">0:00 / 0:00</span>
          <span class="spacer"></span>
          <button id="mute" title="Muet (M)">🔊</button>
          <input id="vol" type="range" min="0" max="1" step="0.05" value="1" aria-label="Volume">
          <select id="speed" aria-label="Vitesse">
            <option value="0.5">0,5×</option><option value="0.75">0,75×</option>
            <option value="1" selected>1×</option><option value="1.25">1,25×</option>
            <option value="1.5">1,5×</option><option value="2">2×</option>
          </select>
          <button id="shot" title="Capture d'écran (S)">📷</button>
          <button id="sub" title="Ajouter des sous-titres">CC</button>
          <button id="open" title="Ouvrir (O)">Ouvrir</button>
          <button id="list" title="Liste de lecture (L)">Liste</button>
          <button id="full" title="Plein écran (F)">⛶</button>
        </div>
      </div>
    </main>
    <aside id="playlist" hidden><ul id="items"></ul></aside>
  </div>
  <script src="renderer.js"></script>
</body>
</html>
